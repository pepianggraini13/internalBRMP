# ==============================================================================
# KONFIGURASI NGINX DI SYNOLOGY WEB STATION (BRMP DIY)
# ==============================================================================
# Jika Web Station Synology Anda menggunakan backend Nginx, tambahkan direktif
# ini pada konfigurasi virtual host:

# 1. API Backend (PHP Unified API)
location /api/ {
    try_files $uri $uri/ /api.php?$query_string;
}

# 2. ADMS Push Receiver (Mesin Absensi ZKTeco / Solution)
location /iclock/ {
    try_files $uri $uri/ /cdata.php?$query_string;
}

location = /cdata {
    try_files $uri /cdata.php?$query_string;
}

# 3. Static Assets & React Single Page Application (SPA)
location / {
    try_files $uri $uri/ /index.html;
}
